<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # CORS: reflect the Origin back and respond to preflight at Apache level
    <IfModule mod_headers.c>
        SetEnvIf Origin "^(https?://.+)$" CORS_ORIGIN=$1
        Header always set Access-Control-Allow-Origin "%{CORS_ORIGIN}e" env=CORS_ORIGIN
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization, Accept, X-Requested-With"
        Header always set Access-Control-Max-Age "3600"
    </IfModule>

    <Directory /var/www/html/public>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
        DirectoryIndex index.php

        # Answer OPTIONS preflight without hitting PHP
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^ - [R=204,L]
    </Directory>

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>